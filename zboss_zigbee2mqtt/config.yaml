name: "Zigbee2MQTT ZBOSS (ESP32-C6)"
version: "1.0.0"
slug: "zboss_zigbee2mqtt"
description: "Zigbee2MQTT otimizado com suporte nativo ZBOSS para o ESP32-C6"
url: "https://github.com/wesioplayconstructor/zboss-zigbee2mqtt-app"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:zigbee"
panel_title: "Zigbee2MQTT"
host_network: true
uart: true
schema:
  homeassistant: bool
  permit_join: bool
  mqtt:
    server: str
    user: str
    password: str
  serial:
    port: str
    adapter: str
    baudrate: int
options:
  homeassistant: true
  permit_join: true
  mqtt:
    server: "mqtt://core-mosquitto:1883"
    user: "wesio"
    password: "wasd"
  serial:
    port: "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_98:A3:16:BF:20:A0-if00"
    adapter: "zboss"
    baudrate: 115200
